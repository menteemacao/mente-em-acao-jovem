<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Aventura 3D Jogável • Mente em Ação Jovem</title><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#f9fbff;background:#101332}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#373082,#0d1534 70%)}button,select{font:inherit}button{cursor:pointer}.wrap{max-width:1080px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}.top a,.top button{background:#263469;border:1px solid #8ba6ec;border-radius:14px;padding:11px 15px;color:white;text-decoration:none}.title{font-size:clamp(23px,4vw,36px);margin:18px 0 5px}.sub{color:#d7ddff}.scene{position:relative;border:3px solid #9ac9ff;border-radius:24px;overflow:hidden;box-shadow:0 14px 40px #0008;background:#172455}.scene>img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover;object-position:center}.scene:after{content:'';pointer-events:none;position:absolute;inset:0;background:linear-gradient(0deg,#070e2ac4,transparent 42%)}.hot{position:absolute;z-index:2;border:2px solid #fff9;border-radius:22px;background:#171d65e8;color:#fff;box-shadow:0 5px 18px #0008;padding:9px;max-width:27%;font-size:clamp(11px,1.5vw,16px);font-weight:750}.hot:focus-visible,.choice:focus-visible{outline:4px solid #ffe97c}.hot.active{background:#197e75;border-color:#8effc5}.scene-note{position:absolute;z-index:2;left:12px;bottom:10px;right:12px;font-weight:700;text-shadow:0 2px 5px #000}.panel{background:#151e4fe9;border:1px solid #788ed0;border-radius:22px;padding:19px;margin:17px 0}.controls{display:flex;flex-wrap:wrap;gap:10px}.controls button,.choice{border:2px solid #8b9de6;background:#273875;color:white;border-radius:15px;padding:12px 16px}.controls button.primary{background:linear-gradient(110deg,#743de7,#1b92d0);border-color:#b9eeff;font-weight:850}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.choice{text-align:left;min-height:85px}.choice.chosen{background:#245f70;border-color:#9effd5}.slot{min-height:88px;border:3px dashed #c2b7ff;border-radius:18px;padding:14px;display:flex;align-items:center;justify-content:center;text-align:center;background:#332765}.feedback{min-height:34px;font-weight:700;color:#b9f8e7}.small{font-size:13px;color:#c5d5ff}.progress{height:9px;border-radius:30px;background:#313960;overflow:hidden;margin:14px 0}.progress div{height:100%;background:#68e3cd;transition:width .2s}.hide{display:none}.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.world{padding:0;border:1px solid #9bc9f3;border-radius:16px;overflow:hidden;background:#253263;color:white;text-align:left}.world img{width:100%;height:115px;object-fit:cover}.world span{display:block;padding:12px;font-weight:750}@media(max-width:650px){.hot{max-width:34%;padding:5px;font-size:11px}.scene>img{aspect-ratio:4/3}.wrap{padding:9px}}

/* EXPERIÊNCIA VISUAL IMERSIVA — preserva as regras dos jogos */
html{min-height:100%;scroll-behavior:smooth}
body{min-height:100svh!important;background:#0a1130!important;position:relative;isolation:isolate}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background-image:linear-gradient(90deg,rgba(8,12,38,.91) 0%,rgba(8,12,38,.68) 42%,rgba(8,12,38,.34) 100%),url('./aventura-adolescentes-3d.png');background-position:center center;background-size:cover;background-repeat:no-repeat}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,transparent 45%,rgba(8,10,34,.70) 100%)}
header,main,footer,.shell,.wrap{max-width:none!important;width:100%;}
header,footer{padding-left:clamp(16px,3vw,60px)!important;padding-right:clamp(16px,3vw,60px)!important}
main,.shell,.wrap{padding-left:clamp(14px,3vw,54px)!important;padding-right:clamp(14px,3vw,54px)!important}
.hero{position:relative;min-height:min(82svh,900px);display:flex;flex-direction:column;justify-content:center;padding:clamp(25px,6vw,100px)!important;margin:0 0 26px!important;border-radius:clamp(20px,2vw,36px);background:linear-gradient(90deg,rgba(7,12,39,.86),rgba(7,12,39,.12)),url('./personagens-3d.jpg') center/cover no-repeat!important;overflow:hidden;box-shadow:0 20px 65px #0008}
.hero h1,.hero .lead,.hero p{position:relative;z-index:2;text-shadow:0 3px 18px #07102b}
.hero h1{max-width:850px}
.card,.world,.arcade-card,.study,.panel,.stat{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 38px #0006!important}
.card,.world,.arcade-card{transition:transform .2s ease,box-shadow .2s ease}
.card:hover,.world:hover,.arcade-card:hover{transform:translateY(-4px);box-shadow:0 20px 50px #0009!important}
.scene{width:100%!important;max-width:none!important;min-height:60svh;border-radius:26px!important;overflow:hidden}
.scene>img,.scene img{object-fit:cover}
.scene>img{min-height:60svh;max-height:82svh}
.fullscreen-control{position:fixed;right:16px;top:14px;z-index:1000;background:#111d4bea;color:#fff;border:1px solid #9de9ff;border-radius:999px;padding:10px 15px;font:700 14px system-ui;cursor:pointer;box-shadow:0 8px 28px #0008}
.fullscreen-control:focus-visible{outline:3px solid #fff}
@media(max-width:700px){body::before{background-position:60% center;background-image:linear-gradient(180deg,rgba(8,12,38,.7),rgba(8,12,38,.82)),url('./aventura-adolescentes-3d.png')}.hero{min-height:65svh;padding:24px!important;background-position:58% center!important}.scene,.scene>img{min-height:46svh}.fullscreen-control{top:auto;bottom:80px;right:10px;font-size:12px;padding:9px 11px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card,.world,.arcade-card{transition:none}}

.wrap{padding-top:72px!important}
.worlds{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))!important}
.scene>img{aspect-ratio:auto!important;height:min(76svh,850px)!important;min-height:400px!important;object-fit:contain!important;background:linear-gradient(130deg,#11153a,#212d65)!important}
@media(max-width:700px){.scene>img{height:52svh!important;min-height:300px!important}}
</style><style>img{object-fit:contain!important;max-width:100%;} .scene>img,.scene img,.world img,.card img,.hero img{object-fit:contain!important;background-color:#101a39!important;} .scene{max-height:none!important;} .scene>img{height:auto!important;min-height:0!important;max-height:none!important;} .world img{height:auto!important;max-height:320px!important;} </style></head><body><main class="wrap"><div class="top"><a href="index.html">⌂ Página principal</a><strong>✨ Aventura 3D com adolescentes</strong><button id="audio" type="button">🔇 Ativar sons</button></div><h1 class="title" id="title">Escolha seu mundo</h1><p class="sub" id="subtitle">Cenas 3D reais dentro do jogo, com pistas e decisões interativas.</p><div class="progress"><div id="progress"></div></div><section id="menu" class="worlds"></section><section id="game" class="hide"><div class="scene"><img id="picture" src="aventura-adolescentes-3d.png" alt="Grupo de adolescentes em uma escola colorida, em estilo tridimensional"><div id="hotspots"></div><div class="scene-note" id="sceneNote"></div></div><div class="panel"><h2 id="task"></h2><p id="instruction"></p><div id="interaction"></div><p class="feedback" id="feedback" aria-live="polite"></p><div class="controls"><button id="back" type="button">← Mundos</button><button id="check" class="primary" type="button">Conferir</button><button id="next" class="primary hide" type="button">Próxima fase →</button></div></div></section></main><script>
const worlds=[
['Quem sou eu?','Quando alguém define você por um rótulo, o que pode ajudar a compreender sua identidade?',['Observar minhas escolhas e interesses','Aceitar o rótulo sem refletir','Reconhecer habilidades que ainda estou desenvolvendo'],[0,2],['Reconhecer o que sinto','Considerar meus valores','Escolher uma atitude coerente']],
['Meu mundo emocional','Uma mensagem inesperada provoca desconforto. O que observar antes de agir?',['Identificar a emoção presente','Supor que sei exatamente a intenção do outro','Considerar o contexto da mensagem'],[0,2],['Perceber a reação','Criar espaço para pensar','Responder com clareza']],
['Relações e conexões','Uma amizade passa por um desentendimento. Que pistas ajudam a construir diálogo?',['Escutar a outra pessoa','Pressionar para concordar imediatamente','Expressar um limite com respeito'],[0,2],['Escutar a versão do outro','Explicar como me senti','Buscar um acordo respeitoso']],
['Mundo digital','Uma publicação está circulando rapidamente. O que vale conferir?',['Quem publicou originalmente','A quantidade de curtidas, como única prova','Se outras fontes confiáveis confirmam'],[0,2],['Identificar a origem','Verificar o contexto','Decidir se devo compartilhar']],
['PNL na prática','Uma mesma situação recebe interpretações diferentes. Que recursos ajudam?',['Examinar minha primeira interpretação','Tratar minha impressão como verdade absoluta','Considerar outros pontos de vista'],[0,2],['Descrever o que aconteceu','Separar fatos de interpretações','Explorar outra perspectiva']],
['Propósito e escolhas','Você quer realizar um projeto que parece distante. Que pistas ajudam a começar?',['Dividir o objetivo em etapas','Esperar que tudo se resolva sozinho','Revisar o plano conforme aprende'],[0,2],['Definir uma meta concreta','Escolher o primeiro passo','Acompanhar e ajustar']],
['Espiritualidade e sentido da vida','Uma oportunidade de solidariedade aparece na escola. O que considerar?',['Ajudar respeitando a autonomia de quem recebe','Agir apenas para ganhar reconhecimento','Perceber necessidades reais do grupo'],[0,2],['Observar a necessidade','Conversar com respeito','Oferecer ajuda possível']]
];
const $=id=>document.getElementById(id);let wi=0,phase=0,selected=new Set(),chosen=-1,sequence=[],enabled=false,completed={};try{completed=JSON.parse(localStorage.getItem('meaj-cinematic-v1')||'{}')}catch{}
function save(){try{localStorage.setItem('meaj-cinematic-v1',JSON.stringify(completed))}catch{}}
function tone(){if(!enabled)return;try{const a=new Audio('sucesso-suave.wav');a.volume=.3;a.play().catch(()=>{})}catch{}}
$('audio').onclick=()=>{enabled=!enabled;$('audio').textContent=enabled?'🔊 Sons ligados':'🔇 Ativar sons';if(enabled)tone()};
function menu(){ $('menu').classList.remove('hide');$('game').classList.add('hide');$('title').textContent='Escolha seu mundo';$('subtitle').textContent='Sete aventuras, três fases por mundo. Toque em um cenário para começar.';$('progress').style.width='0%';$('menu').replaceChildren();worlds.forEach((w,i)=>{const b=document.createElement('button');b.className='world';b.innerHTML='<img src="mundo-'+(i+1)+'.jpg" alt="Cenário 3D"><span>'+(completed[i]?'✓ ':'')+w[0]+' · 3 fases</span>';b.onclick=()=>start(i);$('menu').append(b)})}
function start(i){wi=i;phase=0;render()}
function render(){selected=new Set();chosen=-1;sequence=[...worlds[wi][4]].reverse();$('menu').classList.add('hide');$('game').classList.remove('hide');$('next').classList.add('hide');$('check').classList.remove('hide');$('feedback').textContent='';$('title').textContent=worlds[wi][0];$('subtitle').textContent='Fase '+(phase+1)+' de 3';$('progress').style.width=(phase/3*100)+'%';$('hotspots').replaceChildren();$('interaction').replaceChildren();$('sceneNote').textContent='';$('picture').src=phase===0?'aventura-adolescentes-3d.png':'mundo-'+(wi+1)+'.jpg';const w=worlds[wi];
if(phase===0){$('task').textContent='Encontre duas pistas relevantes';$('instruction').textContent=w[1]+' Toque nas pistas sobre a imagem.';const coords=[[11,48],[40,45],[72,48]];w[2].forEach((txt,i)=>{const b=document.createElement('button');b.type='button';b.className='hot';b.textContent='Pista '+(i+1);b.title=txt;b.style.left=coords[i][0]+'%';b.style.top=coords[i][1]+'%';b.onclick=()=>{selected.has(i)?selected.delete(i):selected.add(i);b.classList.toggle('active');$('feedback').textContent=txt};$('hotspots').append(b)});$('sceneNote').textContent='Toque em cada pista para descobrir o que ela representa.'}
if(phase===1){$('task').textContent='Arraste uma decisão para o espaço';$('instruction').textContent='Escolha uma ação que considere adequada ao contexto. Arraste a carta ou toque nela.';const opts=[w[4][1],'Ignorar todas as informações disponíveis','Pedir mais contexto antes de concluir','Decidir sem considerar consequências'];const box=document.createElement('div');box.className='choices';opts.forEach((txt,i)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=txt;b.draggable=true;b.ondragstart=e=>e.dataTransfer.setData('text/plain',String(i));b.onclick=()=>select(i);box.append(b)});const slot=document.createElement('div');slot.className='slot';slot.textContent='Solte a decisão aqui';slot.ondragover=e=>e.preventDefault();slot.ondrop=e=>{e.preventDefault();select(Number(e.dataTransfer.getData('text/plain')))};$('interaction').append(box,slot);function select(i){chosen=i;slot.textContent=opts[i];box.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('chosen',i===j))}}
if(phase===2){$('task').textContent='Organize a estratégia';$('instruction').textContent='Use as setas para colocar as três ações em uma ordem coerente.';const list=document.createElement('div');$('interaction').append(list);function draw(){list.replaceChildren();sequence.forEach((t,i)=>{const row=document.createElement('div');row.className='controls';row.style.margin='8px 0';const label=document.createElement('span');label.className='choice';label.style.flex='1';label.textContent=t;row.append(label);for(const [symbol,dir] of [['↑',-1],['↓',1]]){const b=document.createElement('button');b.textContent=symbol;b.disabled=i+dir<0||i+dir>=sequence.length;b.onclick=()=>{[sequence[i],sequence[i+dir]]=[sequence[i+dir],sequence[i]];draw()};row.append(b)}list.append(row)})}draw()}}
$('check').onclick=()=>{let ok=false;if(phase===0)ok=selected.size===2&&worlds[wi][3].every(i=>selected.has(i));if(phase===1)ok=chosen===0||chosen===2;if(phase===2)ok=sequence.join('|')===worlds[wi][4].join('|');$('feedback').textContent=ok?'✨ Muito bem! Você concluiu a fase.':'🔎 Ainda há algo para investigar. Revise as pistas e tente novamente.';if(ok){tone();$('check').classList.add('hide');$('next').classList.remove('hide');if(phase===2){completed[wi]=true;save();$('progress').style.width='100%'}}};$('next').onclick=()=>{if(phase===2)menu();else{phase++;render()}};$('back').onclick=menu;menu();
</script><script>
(function(){
 const b=document.createElement('button');b.type='button';b.className='fullscreen-control';b.textContent='⛶ Tela inteira';b.setAttribute('aria-label','Alternar modo de tela inteira');
 b.addEventListener('click',async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen()}else{b.textContent='Tela inteira indisponível neste navegador'}}catch{b.textContent='Tela inteira indisponível'}});
 document.addEventListener('fullscreenchange',()=>{b.textContent=document.fullscreenElement?'↙ Sair da tela inteira':'⛶ Tela inteira'});
 document.body.appendChild(b);
})();
</script></body></html>
